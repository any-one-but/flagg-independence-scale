<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roc Grotesk', 'Helvetica Neue', Arial, sans-serif;
      padding: 3rem 1.5rem;
      color: #000000;
    }

    .wrapper {
      width: 100%;
      max-width: 560px;
    }

    .page-header {
      margin-bottom: 2.5rem;
    }

    .page-title {
      font-size: 1.9rem;
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }

    .page-description {
      font-size: 0.95rem;
      line-height: 1.45;
      color: #333333;
      max-width: 28rem;
    }

    .category {
      margin-bottom: 2.25rem;
    }

    .category:last-child {
      margin-bottom: 0;
    }

    .row-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #555555;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .cells {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.45rem;
    }

    .cell {
      aspect-ratio: 2 / 1;
      border: 1.5px solid #000000;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        transform 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
    }

    .cell:hover {
      border-color: #000000;
      background: rgba(0, 0, 0, 0.06);
    }

    .cell:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
    }

    .cell:active {
      transform: scale(0.94);
    }

    .cell.selected {
      border-color: #000000;
      background: #000000;
    }

    .cell.selected:hover {
      border-color: #222222;
      background: #222222;
    }

    .cell-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .tooltip {
      position: fixed;
      z-index: 100;
      width: max-content;
      max-width: 240px;
      background: #ffffff;
      color: #111111;
      font-size: 0.82rem;
      line-height: 1.5;
      padding: 0.85rem 1rem;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transform-origin: bottom center;
      transition:
        opacity 0.18s ease,
        transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tooltip.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .tooltip.below {
      transform-origin: top center;
    }

    .tooltip-title {
      font-weight: 700;
      color: #000000;
      margin-bottom: 0.25rem;
      letter-spacing: 0.01em;
    }

    .tooltip-arrow {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ffffff;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .cell-caption {
      font-size: 0.68rem;
      line-height: 1.25;
      color: #333333;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .score {
      margin-top: 2.5rem;
      font-size: 1.1rem;
      color: #555555;
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .score.visible {
      opacity: 1;
    }

    .score-value {
      color: #000000;
      font-weight: 700;
    }

    .copyright {
      margin-top: 3.5rem;
      font-size: 0.62rem;
      line-height: 1.4;
      color: #888888;
      letter-spacing: 0.01em;
    }

    @media (max-width: 420px) {
      .cells {
        gap: 0.3rem;
      }
      .category {
        margin-bottom: 1.75rem;
      }
      .cell-caption {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper" id="wrapper">
    <header class="page-header">
      <h1 class="page-title">Flagg Independence Scale</h1>
      <p class="page-description">Click or tap the option in each row that best describes your independence in that area.</p>
    </header>
    <div class="score" id="score">
      <span class="score-value" id="score-value">0</span> / 25 <span id="score-pct"></span>
    </div>
    <p class="copyright">© 2022 Nancy N. Flagg. All Rights Reserved.</p>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true">
    <div class="tooltip-arrow" id="tooltip-arrow"></div>
    <div class="tooltip-title" id="tooltip-title"></div>
    <div class="tooltip-desc" id="tooltip-desc"></div>
  </div>

  <script>
    const PLACEHOLDER = 'Placeholder description — more detail about what this option means will go here.';

    const ROWS = [
      {
        label: 'Shelter',
        options: [
          { label: 'No Shelter', desc: PLACEHOLDER },
          { label: 'Shelter', desc: PLACEHOLDER },
          { label: 'Utility Equipped', desc: PLACEHOLDER },
          { label: 'Privacy', desc: PLACEHOLDER },
          { label: 'Stability', desc: PLACEHOLDER },
        ],
      },
      {
        label: 'Transportation',
        options: [
          { label: 'No Transport', desc: PLACEHOLDER },
          { label: 'Public Transit', desc: PLACEHOLDER },
          { label: 'Short Distance', desc: PLACEHOLDER },
          { label: 'Long Distance', desc: PLACEHOLDER },
          { label: 'Independence', desc: PLACEHOLDER },
        ],
      },
      {
        label: 'Water and Food',
        options: [
          { label: 'No Water', desc: PLACEHOLDER },
          { label: 'Clean Water', desc: PLACEHOLDER },
          { label: 'Some Food', desc: PLACEHOLDER },
          { label: 'Enough Food', desc: PLACEHOLDER },
          { label: 'Healthy Food', desc: PLACEHOLDER },
        ],
      },
      {
        label: 'Safety and Security',
        options: [
          { label: 'Mortal Danger', desc: PLACEHOLDER },
          { label: 'Physical Danger', desc: PLACEHOLDER },
          { label: 'Dangerous Location', desc: PLACEHOLDER },
          { label: 'No Emergency Savings', desc: PLACEHOLDER },
          { label: 'Safety', desc: PLACEHOLDER },
        ],
      },
      {
        label: 'Health and Wellbeing',
        options: [
          { label: 'No Emergency Access', desc: PLACEHOLDER },
          { label: 'Communication', desc: PLACEHOLDER },
          { label: 'Vital Medications', desc: PLACEHOLDER },
          { label: 'All Medications', desc: PLACEHOLDER },
          { label: 'Full Healthcare', desc: PLACEHOLDER },
        ],
      },
    ];

    const COLS = 5;
    const MAX_SCORE = 25;
    const selections = {};

    const wrapper = document.getElementById('wrapper');
    const scoreEl = document.getElementById('score');
    const scoreValueEl = document.getElementById('score-value');
    const scorePctEl = document.getElementById('score-pct');

    ROWS.forEach(({ label, options }, rowIdx) => {
      const category = document.createElement('div');
      category.className = 'category';
      category.setAttribute('role', 'radiogroup');
      category.setAttribute('aria-label', label);

      const labelEl = document.createElement('div');
      labelEl.className = 'row-label';
      labelEl.textContent = label;
      category.appendChild(labelEl);

      const cells = document.createElement('div');
      cells.className = 'cells';

      for (let col = 0; col < COLS; col++) {
        const { label: caption, desc } = options[col] || { label: '', desc: '' };

        const wrap = document.createElement('div');
        wrap.className = 'cell-wrap';

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('role', 'radio');
        cell.setAttribute('aria-checked', 'false');
        cell.setAttribute('aria-label', `${label}: ${caption}`);
        cell.setAttribute('tabindex', col === 0 ? '0' : '-1');
        cell.dataset.row = rowIdx;
        cell.dataset.col = col;

        cell.addEventListener('click', () => {
          handleSelect(rowIdx, col);
          pinnedCell = cell;
          pinnedContent = tipContent;
          showTooltip(cell, tipContent);
        });
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleSelect(rowIdx, col);
          }
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            focusCell(rowIdx, Math.min(col + 1, COLS - 1));
          }
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            focusCell(rowIdx, Math.max(col - 1, 0));
          }
        });

        const tipContent = { title: caption, desc };
        cell.addEventListener('mouseenter', () => showTooltip(cell, tipContent));
        cell.addEventListener('mouseleave', restoreOrHide);
        cell.addEventListener('focus', () => showTooltip(cell, tipContent));
        cell.addEventListener('blur', restoreOrHide);

        const captionEl = document.createElement('div');
        captionEl.className = 'cell-caption';
        captionEl.textContent = caption;

        wrap.appendChild(cell);
        wrap.appendChild(captionEl);
        cells.appendChild(wrap);
      }

      category.appendChild(cells);
      wrapper.insertBefore(category, scoreEl);
    });

    const tooltipEl = document.getElementById('tooltip');
    const tooltipTitleEl = document.getElementById('tooltip-title');
    const tooltipDescEl = document.getElementById('tooltip-desc');
    const tooltipArrowEl = document.getElementById('tooltip-arrow');
    let pinnedCell = null;
    let pinnedContent = null;

    // When a hover/focus ends, fall back to the pinned tooltip (if any) or hide.
    function restoreOrHide() {
      if (pinnedCell) showTooltip(pinnedCell, pinnedContent);
      else hideTooltip();
    }

    // Dismiss a pinned tooltip when tapping/clicking anywhere outside its cell.
    document.addEventListener('click', (e) => {
      if (pinnedCell && !pinnedCell.contains(e.target)) {
        pinnedCell = null;
        pinnedContent = null;
        hideTooltip();
      }
    });

    function showTooltip(cell, { title, desc }) {
      tooltipTitleEl.textContent = title;
      tooltipDescEl.textContent = desc;
      tooltipEl.setAttribute('aria-hidden', 'false');

      // Make measurable, then position.
      tooltipEl.style.visibility = 'hidden';
      tooltipEl.classList.add('visible');

      const margin = 10;
      const gap = 10;
      const cellRect = cell.getBoundingClientRect();
      const tipRect = tooltipEl.getBoundingClientRect();
      const vw = document.documentElement.clientWidth;

      // Horizontal: centre over the cell, clamped to viewport.
      let left = cellRect.left + cellRect.width / 2 - tipRect.width / 2;
      left = Math.max(margin, Math.min(left, vw - tipRect.width - margin));

      // Vertical: prefer above; flip below if not enough room.
      const placeBelow = cellRect.top - tipRect.height - gap < margin;
      const top = placeBelow
        ? cellRect.bottom + gap
        : cellRect.top - tipRect.height - gap;

      tooltipEl.classList.toggle('below', placeBelow);

      // Arrow points at the cell centre, clamped to the tooltip body.
      const arrowX = cellRect.left + cellRect.width / 2 - left;
      const clampedArrowX = Math.max(14, Math.min(arrowX, tipRect.width - 14));
      tooltipArrowEl.style.left = `${clampedArrowX - 6}px`;
      if (placeBelow) {
        tooltipArrowEl.style.top = '-6px';
        tooltipArrowEl.style.bottom = '';
      } else {
        tooltipArrowEl.style.top = '';
        tooltipArrowEl.style.bottom = '-6px';
      }

      tooltipEl.style.left = `${left}px`;
      tooltipEl.style.top = `${top}px`;
      tooltipEl.style.visibility = '';
    }

    function hideTooltip() {
      tooltipEl.classList.remove('visible');
      tooltipEl.setAttribute('aria-hidden', 'true');
    }

    function getCell(rowIdx, colIdx) {
      return wrapper.querySelector(`[data-row="${rowIdx}"][data-col="${colIdx}"]`);
    }

    function focusCell(rowIdx, colIdx) {
      const cell = getCell(rowIdx, colIdx);
      if (cell) cell.focus();
    }

    function handleSelect(rowIdx, colIdx) {
      const prev = selections[rowIdx];

      if (prev !== undefined) {
        const prevCell = getCell(rowIdx, prev);
        if (prevCell) {
          prevCell.classList.remove('selected');
          prevCell.setAttribute('aria-checked', 'false');
          prevCell.setAttribute('tabindex', '-1');
        }
      }

      if (prev === colIdx) {
        delete selections[rowIdx];
        const cell = getCell(rowIdx, colIdx);
        if (cell) cell.setAttribute('tabindex', '0');
        updateScore();
        return;
      }

      selections[rowIdx] = colIdx;
      const cell = getCell(rowIdx, colIdx);
      if (cell) {
        cell.classList.add('selected');
        cell.setAttribute('aria-checked', 'true');
        cell.setAttribute('tabindex', '0');
      }
      updateScore();
    }

    function updateScore() {
      const total = Object.values(selections).reduce((sum, col) => sum + (col + 1), 0);
      const hasAny = Object.keys(selections).length > 0;
      scoreValueEl.textContent = total;
      scorePctEl.textContent = hasAny ? `(${Math.round(total / MAX_SCORE * 100)}%)` : '';
      scoreEl.classList.toggle('visible', hasAny);
    }
  </script>

</body>
</html>

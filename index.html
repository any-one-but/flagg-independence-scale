<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #e9e2d8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      padding: 3rem 1.5rem;
      color: #2e2318;
    }

    .wrapper {
      width: 100%;
      max-width: 560px;
    }

    .category {
      margin-bottom: 2.25rem;
    }

    .category:last-child {
      margin-bottom: 0;
    }

    .row-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #8a7868;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .cells {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.45rem;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: 1.5px solid #c2b8ac;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        transform 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
    }

    .cell:hover {
      border-color: #9e7055;
      background: rgba(158, 112, 85, 0.07);
    }

    .cell:focus-visible {
      outline: 2px solid #9e7055;
      outline-offset: 2px;
    }

    .cell:active {
      transform: scale(0.94);
    }

    .cell.selected {
      border-color: #9e7055;
      background: #9e7055;
    }

    .cell.selected:hover {
      border-color: #8c6248;
      background: #8c6248;
    }

    .score {
      margin-top: 2.5rem;
      font-size: 1.1rem;
      color: #8a7868;
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .score.visible {
      opacity: 1;
    }

    .score-value {
      color: #2e2318;
      font-weight: 500;
    }

    @media (max-width: 420px) {
      .cells {
        gap: 0.3rem;
      }
      .category {
        margin-bottom: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper" id="wrapper">
    <div class="score" id="score">
      <span class="score-value" id="score-value">0</span> / 25
    </div>
  </div>

  <script>
    const ROW_LABELS = [
      'Shelter',
      'Transportation',
      'Water and Food',
      'Safety and Security',
      'Health and Wellbeing',
    ];

    const COLS = 5;
    const MAX_SCORE = 25;
    const selections = {};

    const wrapper = document.getElementById('wrapper');
    const scoreEl = document.getElementById('score');
    const scoreValueEl = document.getElementById('score-value');

    ROW_LABELS.forEach((label, rowIdx) => {
      const category = document.createElement('div');
      category.className = 'category';
      category.setAttribute('role', 'radiogroup');
      category.setAttribute('aria-label', label);

      const labelEl = document.createElement('div');
      labelEl.className = 'row-label';
      labelEl.textContent = label;
      category.appendChild(labelEl);

      const cells = document.createElement('div');
      cells.className = 'cells';

      for (let col = 0; col < COLS; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('role', 'radio');
        cell.setAttribute('aria-checked', 'false');
        cell.setAttribute('aria-label', `${label}, option ${col + 1}`);
        cell.setAttribute('tabindex', col === 0 ? '0' : '-1');
        cell.dataset.row = rowIdx;
        cell.dataset.col = col;

        cell.addEventListener('click', () => handleSelect(rowIdx, col));
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleSelect(rowIdx, col);
          }
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            focusCell(rowIdx, Math.min(col + 1, COLS - 1));
          }
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            focusCell(rowIdx, Math.max(col - 1, 0));
          }
        });

        cells.appendChild(cell);
      }

      category.appendChild(cells);
      wrapper.insertBefore(category, scoreEl);
    });

    function getCell(rowIdx, colIdx) {
      return wrapper.querySelector(`[data-row="${rowIdx}"][data-col="${colIdx}"]`);
    }

    function focusCell(rowIdx, colIdx) {
      const cell = getCell(rowIdx, colIdx);
      if (cell) cell.focus();
    }

    function handleSelect(rowIdx, colIdx) {
      const prev = selections[rowIdx];

      if (prev !== undefined) {
        const prevCell = getCell(rowIdx, prev);
        if (prevCell) {
          prevCell.classList.remove('selected');
          prevCell.setAttribute('aria-checked', 'false');
          prevCell.setAttribute('tabindex', '-1');
        }
      }

      if (prev === colIdx) {
        delete selections[rowIdx];
        const cell = getCell(rowIdx, colIdx);
        if (cell) cell.setAttribute('tabindex', '0');
        updateScore();
        return;
      }

      selections[rowIdx] = colIdx;
      const cell = getCell(rowIdx, colIdx);
      if (cell) {
        cell.classList.add('selected');
        cell.setAttribute('aria-checked', 'true');
        cell.setAttribute('tabindex', '0');
      }
      updateScore();
    }

    function updateScore() {
      const total = Object.values(selections).reduce((sum, col) => sum + (col + 1), 0);
      const hasAny = Object.keys(selections).length > 0;
      scoreValueEl.textContent = total;
      scoreEl.classList.toggle('visible', hasAny);
    }
  </script>

</body>
</html>
